{% extends "base.html" %}
{% block title %}Application Details{% endblock %}

{% block content %}
<div id="alertBox"></div>

<div id="detailContainer">
  <div class="spinner-wrapper"><div class="spinner-border text-primary"></div></div>
</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">Are you sure you want to delete this application?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  if (!JobTrack.requireAuth()) { /* redirected */ }

  const applicationId = {{ application_id }};
  const deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));

  function interviewRow(i) {
    return `
      <tr>
        <td>${JobTrack.formatDate(i.interview_date)}</td>
        <td>${JobTrack.formatTime(i.interview_time)}</td>
        <td>${i.interview_type}</td>
        <td>${JobTrack.escapeHtml(i.interviewer || "-")}</td>
        <td><span class="badge ${i.result === "Passed" ? "bg-success-subtle text-success" : i.result === "Failed" ? "bg-danger-subtle text-danger" : "bg-secondary-subtle text-secondary"}">${i.result}</span></td>
        <td>${i.meeting_link ? `<a href="${JobTrack.escapeHtml(i.meeting_link)}" target="_blank">Join</a>` : "-"}</td>
        <td class="text-end"><a href="/interviews/${i.id}/edit/?application=${applicationId}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a></td>
      </tr>`;
  }

  async function loadDetail() {
    try {
      const app = await JobTrack.apiFetch(`/api/applications/${applicationId}/`);
      const container = document.getElementById("detailContainer");
      container.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
          <div>
            <h2 class="jt-page-title mb-1">${JobTrack.escapeHtml(app.job_title)}</h2>
            <p class="jt-page-subtitle mb-0">${JobTrack.escapeHtml(app.company.company_name)}${app.location ? " · " + JobTrack.escapeHtml(app.location) : ""}</p>
          </div>
          <div class="d-flex gap-2">
            <a href="/applications/${applicationId}/edit/" class="btn btn-outline-primary"><i class="bi bi-pencil me-1"></i>Edit</a>
            <button class="btn btn-outline-danger" onclick="deleteModal.show()"><i class="bi bi-trash me-1"></i>Delete</button>
            <a href="/applications/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-8">
            <div class="jt-card p-4 mb-3">
              <h6 class="fw-semibold mb-3">Application Information</h6>
              <div class="row g-3">
                <div class="col-sm-6"><div class="text-muted small">Company</div><div class="fw-semibold">${JobTrack.escapeHtml(app.company.company_name)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Job Title</div><div class="fw-semibold">${JobTrack.escapeHtml(app.job_title)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Location</div><div class="fw-semibold">${JobTrack.escapeHtml(app.location || "-")}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Job Type</div><div class="fw-semibold">${app.job_type}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Salary</div><div class="fw-semibold">${JobTrack.formatCurrency(app.salary)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Application Date</div><div class="fw-semibold">${JobTrack.formatDate(app.application_date)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Status</div><div>${JobTrack.statusBadge(app.status)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Priority</div><div>${JobTrack.priorityBadge(app.priority)}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Job URL</div><div class="fw-semibold text-truncate">${app.job_url ? `<a href="${JobTrack.escapeHtml(app.job_url)}" target="_blank">${JobTrack.escapeHtml(app.job_url)}</a>` : "-"}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Created</div><div class="fw-semibold">${JobTrack.formatDate(app.created_at.slice(0,10))}</div></div>
                <div class="col-sm-6"><div class="text-muted small">Last Updated</div><div class="fw-semibold">${JobTrack.formatDate(app.updated_at.slice(0,10))}</div></div>
                <div class="col-12"><div class="text-muted small">Notes</div><div>${app.notes ? JobTrack.escapeHtml(app.notes) : '<span class="text-muted">No notes added.</span>'}</div></div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="jt-card p-4">
              <h6 class="fw-semibold mb-3">Quick Actions</h6>
              <a href="/interviews/add/?application=${applicationId}" class="btn btn-primary w-100 mb-2"><i class="bi bi-plus-lg me-1"></i>Add Interview</a>
              <a href="/applications/${applicationId}/edit/" class="btn btn-outline-primary w-100 mb-2"><i class="bi bi-pencil me-1"></i>Edit Application</a>
              <a href="/applications/" class="btn btn-outline-secondary w-100"><i class="bi bi-arrow-left me-1"></i>Back to Applications</a>
            </div>
          </div>
        </div>

        <div class="jt-card p-4 mt-3">
          <h6 class="fw-semibold mb-3"><i class="bi bi-camera-video me-1"></i>Interviews</h6>
          ${app.interviews.length ? `
            <div class="table-responsive">
              <table class="table table-jt align-middle mb-0">
                <thead><tr><th>Date</th><th>Time</th><th>Type</th><th>Interviewer</th><th>Result</th><th>Link</th><th></th></tr></thead>
                <tbody>${app.interviews.map(interviewRow).join("")}</tbody>
              </table>
            </div>` : `<div class="jt-empty-state py-4"><i class="bi bi-calendar-x"></i>No interviews scheduled yet.</div>`}
        </div>
      `;
    } catch (err) {
      JobTrack.showAlert("alertBox", JobTrack.formatErrors(err.data));
    }
  }

  document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
    try {
      await JobTrack.apiFetch(`/api/applications/${applicationId}/`, { method: "DELETE" });
      JobTrack.setFlash("Application deleted successfully.");
      window.location.href = "/applications/";
    } catch (err) {
      deleteModal.hide();
      JobTrack.showAlert("alertBox", JobTrack.formatErrors(err.data));
    }
  });

  JobTrack.consumeFlash("alertBox");
  loadDetail();
</script>
{% endblock %}
