{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="/login/" class="jt-brand text-decoration-none d-inline-flex align-items-center">
        <i class="bi bi-briefcase-fill me-2"></i>JobTrack
      </a>
      <p class="jt-page-subtitle mt-2 mb-0">Create an account to start tracking applications.</p>
    </div>

    <div id="alertBox"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="8" required>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="registerBtn">
        <span class="spinner-border spinner-border-sm d-none" id="registerSpinner"></span>
        Create Account
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted small">
      Already have an account? <a href="/login/">Log in</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  if (JobTrack.isLoggedIn()) window.location.href = "/";

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    JobTrack.clearAlert("alertBox");

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) {
      JobTrack.showAlert("alertBox", "Passwords do not match.");
      return;
    }

    const btn = document.getElementById("registerBtn");
    const spinner = document.getElementById("registerSpinner");
    btn.disabled = true;
    spinner.classList.remove("d-none");

    try {
      const data = await JobTrack.apiFetch("/api/register/", {
        method: "POST",
        body: {
          full_name: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: password,
          confirm_password: confirmPassword,
        },
      });
      JobTrack.setSession({ access: data.tokens.access, refresh: data.tokens.refresh, user: data.user });
      window.location.href = "/";
    } catch (err) {
      JobTrack.showAlert("alertBox", JobTrack.formatErrors(err.data));
    } finally {
      btn.disabled = false;
      spinner.classList.add("d-none");
    }
  });
</script>
{% endblock %}
